name: Daily Cars Post

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: asia-motors-bot-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-cars:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AI assistant footer to captions
        run: python3 asia_add_ai.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          BUSINESS_CONNECTION_ID: ${{ secrets.BUSINESS_CONNECTION_ID }}
        run: python bot.py

      - name: Commit updated posted cars
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_cars.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted_cars.json" && git push) || true
