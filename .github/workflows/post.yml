name: Post Cars Now

on:
  workflow_dispatch:

concurrency:
  group: asia-motors-bot-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
      - name: Commit updated posted cars
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_cars.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted_cars.json" && git push) || true
